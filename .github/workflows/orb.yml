name: orb-bot

on:
  schedule:
    # Sesión (selección a las 9:35 y entradas hasta las 11:00 NY). Arranca antes y espera,
    # para no depender de los atrasos de GitHub. Hay crons para horario de verano y de invierno;
    # el que no corresponde sale solo.
    - cron: "45 12 * * 1-5"
    - cron: "5 13 * * 1-5"
    - cron: "45 13 * * 1-5"
    - cron: "5 14 * * 1-5"
    # Cierre de todo a las 15:50 NY y resumen del día.
    - cron: "25 19 * * 1-5"
    - cron: "40 19 * * 1-5"
    - cron: "25 20 * * 1-5"
    - cron: "40 20 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "status: posiciones y resultado de hoy | diagnostic: selección de la última sesión (ninguno opera)"
        type: choice
        options:
          - status
          - diagnostic
          - session
          - close
        default: status

permissions:
  contents: write

concurrency:
  group: orb-${{ (contains(github.event.schedule, ' 19 ') || contains(github.event.schedule, ' 20 ') || inputs.mode == 'close') && 'close' || 'session' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Traer el registro más reciente
        # The job runs on the commit it was scheduled with; the journal may be newer on main.
        run: |
          git fetch -q origin main
          if git cat-file -e origin/main:orb_journal.csv 2>/dev/null; then
            git show origin/main:orb_journal.csv > orb_journal.csv
          fi

      - name: Ejecutar bot ORB (PAPER)
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            MODE="$INPUT_MODE"
          else
            case "$SCHEDULE" in
              *" 19 "*|*" 20 "*) MODE=close ;;
              *) MODE=session ;;
            esac
          fi
          echo "Modo: $MODE"
          python orb_bot.py "$MODE"

      - name: Guardar registro de operaciones
        if: always()
        run: |
          [ -f orb_journal.csv ] || exit 0
          git fetch -q origin main
          if git cat-file -e origin/main:orb_journal.csv 2>/dev/null && git diff --quiet origin/main -- orb_journal.csv; then
            exit 0  # nothing new
          fi
          cp orb_journal.csv "$RUNNER_TEMP/orb_journal.csv"
          git checkout -q -f -B main origin/main
          cp "$RUNNER_TEMP/orb_journal.csv" orb_journal.csv
          git config user.name "nvda-bot"
          git config user.email "bot@users.noreply.github.com"
          git add orb_journal.csv
          git commit -q -m "Registro ORB del día"
          git push -q origin main
